<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet Elon Musk</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      color: #bbb;
      font-size: 18px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      margin: 20px 0;
      padding: 8px 16px;
      border: 1px solid #35d04f;
      border-radius: 20px;
      color: #35d04f;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="badge">✓ Official Community Project</div>

    <h1>Meet Elon Musk</h1>

    <p>
      Explore the ideas, innovation, and journey of one of the world's
      most influential technology entrepreneurs.
    </p>

    <a class="btn" href="#">Explore</a>
  </div>
</body>
</html>
